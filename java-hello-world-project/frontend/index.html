<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f4f7fb; color: #1d2939; }
      main { text-align: center; padding: 3rem; background: white; border-radius: 16px; box-shadow: 0 12px 32px #1018281a; }
      h1 { margin: 0; font-size: clamp(2rem, 8vw, 4rem); }
      p { color: #667085; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="message">Yükleniyor...</h1>
      <p>Güncellenmis mesaj</p>
    </main>
    <script>
      fetch('http://localhost:8080/api/hello')
        .then(response => response.json())
        .then(data => document.getElementById('message').textContent = data.message)
        .catch(() => document.getElementById('message').textContent = 'Backend çalışmıyor');
    </script>
  </body>
</html>
