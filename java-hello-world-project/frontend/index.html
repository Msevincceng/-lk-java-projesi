<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      * { box-sizing: border-box; }
      /* Arka plan rengi değiştirildi */
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #1e1b4b; color: #1d2939; }
      main { text-align: center; padding: 3rem; background: white; border-radius: 16px; box-shadow: 0 12px 32px #1018281a; }
      /* Eklenen başlık için stil */
      .sub-title { margin: 0 0 1rem 0; font-size: 1.1rem; color: #6366f1; text-transform: uppercase; letter-spacing: 1px; }
      h1 { margin: 0; font-size: clamp(2rem, 8vw, 4rem); }
      p { color: #667085; }
    </style>
  </head>
  <body>
    <main>
      <p class="sub-title">deneme satırı</p>
      <h1 id="message">Yükleniyor...</h1>
      <p>Bu metin feature/welcome-text branch'inde değiştirildi.</p>
    </main>
    <script>
      fetch('http://localhost:8080/api/hello')
        .then(response => response.json())
        .then(data => document.getElementById('message').textContent = data.message)
        .catch(() => document.getElementById('message').textContent = 'Backend çalışmıyor');
    </script>
  </body>
</html>
